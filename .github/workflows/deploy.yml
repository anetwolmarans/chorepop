# ChorePop — auto-deploy: this workflow takes the zip you uploaded,
# unzips it on GitHub's servers, and publishes it to GitHub Pages.
# You never need to unzip anything on your computer.
name: Deploy ChorePop to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:   # also lets you run it manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip site files
        run: |
          mkdir -p _site
          unzip -o chorepop-web-github-pages.zip -d _site
          ls _site

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
